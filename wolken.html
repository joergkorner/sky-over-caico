<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolken über Caicó</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --line: #dcdad3; --ink: #0b0b0b; --ink2: #52514e; --ink3: #7d7b75;
  --blue: #2a78d6; --blue-soft: #cde2fb; --orange: #eb6834; --orange-soft: #fbd9c9; --sel: #1d2433;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
header { padding: 18px 24px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.lang { display: flex; border: 1px solid #b9b7af; border-radius: 8px; overflow: hidden; flex: none; }
.lang button { font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 7px 11px; border: 0; background: var(--surface); color: var(--ink2); cursor: pointer; }
.lang button.on { background: var(--sel); color: #fff; }
h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
.sub { color: var(--ink2); font-size: 14px; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; padding: 0 24px; align-items: start; }
#mapwrap { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #e8e7e2; }
#map { height: calc(100vh - 210px); min-height: 520px; }
.leaflet-tile-pane.hell { filter: grayscale(0.55) brightness(1.12) contrast(0.85); opacity: 0.85; }
.infobox { position: absolute; top: 10px; left: 54px; z-index: 500; background: rgba(252,252,251,0.93); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 11px; font-size: 13px; color: var(--ink2); pointer-events: none; }
.infobox b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
.legend { position: absolute; bottom: 10px; left: 10px; z-index: 500; background: rgba(252,252,251,0.93); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 11px; font-size: 12.5px; color: var(--ink2); }
.legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin: 0 4px 0 10px; border: 1.5px solid #555; }
.legend span.sw:first-child { margin-left: 0; }
aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.card h2 { font-size: 15px; margin: 0 0 6px; }
.muted { color: var(--ink3); font-size: 12.5px; }
#sky { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background: #111; }
#wolke video { width: 100%; max-width: 360px; display: block; margin: 6px auto; border-radius: 6px; background: #111; }
#wolke dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 8px 0; font-size: 13.5px; }
#wolke dt { color: var(--ink2); }
#wolke dd { margin: 0; font-variant-numeric: tabular-nums; }
a.nr { color: var(--blue); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink2); margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 6px 24px 12px; position: sticky; top: 0; z-index: 1000; background: var(--bg); }
.controls button, dialog button { font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid #b9b7af; background: var(--surface); cursor: pointer; }
.controls button.prim { background: var(--sel); color: #fff; border-color: var(--sel); min-width: 84px; }
#zeit { flex: 1 1 300px; }
.controls label { font-size: 13.5px; color: var(--ink2); white-space: nowrap; }
.controls input[type=number] { width: 78px; font: inherit; padding: 3px 6px; }
section.text { padding: 8px 24px 24px; max-width: 1180px; }
section.text h2 { font-size: 19px; margin: 26px 0 6px; }
section.text h3 { font-size: 15.5px; margin: 0 0 4px; }
details.mehr { margin: 18px 0 10px; border-top: 1px solid var(--line); padding-top: 10px; }
details.mehr > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; color: var(--ink2); padding: 4px 0; }
details.mehr > summary::-webkit-details-marker { display: none; }
details.mehr > summary::before { content: '\25B8'; color: var(--ink3); display: inline-block; width: 12px; transition: transform .15s; }
details.mehr[open] > summary::before { transform: rotate(90deg); }
details.mehr .mt { font-size: 15px; font-weight: 600; }
details.mehr .mx { font-size: 13px; color: var(--ink3); }
details.mehr > summary:hover .mt { text-decoration: underline; text-underline-offset: 3px; }
.kpis { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0 4px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 150px; }
.kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--ink2); font-size: 13px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 12px; }
.charts .card { min-height: 300px; }
.chartbox { position: relative; height: 230px; }
.chartbox.small { height: 170px; }
.einfach { background: #eef3fb; border-left: 3px solid var(--blue); padding: 6px 10px; border-radius: 4px; font-size: 14px; margin-top: 8px; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(1150px, 96vw); max-height: 88vh; }
dialog .head { position: sticky; top: 0; background: var(--surface); padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
dialog[open] { display: flex; flex-direction: column; }
dialog .head, dialog .filt { flex: none; }
dialog .body { padding: 0 16px 16px; overflow: auto; flex: 1 1 auto; min-height: 0; }
dialog .filt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink2); }
dialog .filt select { font: inherit; padding: 2px 4px; margin-left: 4px; max-width: 210px; }
dialog .filt select.an { border-color: var(--sel); background: #eef3fb; color: var(--ink); }
dialog .filt .anz { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }
dialog .filt button { padding: 3px 9px; font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 7px; border-bottom: 1px solid #ebe9e3; text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: #f0efea; cursor: pointer; font-weight: 600; }
th.num, td.num { text-align: right; }
tbody tr:hover { background: #eef3fb; cursor: pointer; }
.lbl { text-align: center; font: 600 12px/16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1d2433;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; white-space: nowrap; pointer-events: none; }
.lbl.sel { color: #000; font-size: 14px; }
.lbl.uns { color: #4f4d48; }
#wolke .warum { background: #f0efea; border-left: 3px solid #8f8d86; padding: 5px 9px; border-radius: 4px; font-size: 13px; color: var(--ink2); margin: 4px 0 6px; }
@media (max-width: 900px) {
  .top { grid-template-columns: 1fr; padding: 0 12px; }
  #map { height: 62vh; min-height: 380px; }
  header, .controls, section.text { padding-left: 12px; padding-right: 12px; }
}
</style>
</head>

</section>

</dialog>

  zusammen: 'Zwischen {von} und {bis} zogen die Wolken stetig aus Osten ({w0}°–{w1}°) über die Kamera. Von den {n} Wolken der Liste sind {g} im Blickfeld entstanden, {a} haben sich von einer grösseren gelöst, {h} kamen über den Horizont und {f} waren zu Beginn der Aufnahme schon da. {e1} lösten sich vor unseren Augen auf, {e2} gingen in einer anderen auf, {e3} zogen tiefer als 12° über den Horizont. Ganz gesehene Wolken lebten typischerweise {d} Minuten und waren nach etwa {p} % ihrer Lebenszeit am breitesten.',
  einfach1: 'Einfach gesagt: Die meisten kleinen Wolken an diesem Vormittag lebten nur wenige Minuten. Sie wuchsen etwa bis zur Mitte ihres Lebens und zerfielen dann wieder. Mit der Zeit gab es mehr Wolken, und die Basis stieg.',

  ch2_txt: 'Jede der {n} ganz gesehenen Wolken ist auf ihre eigene Lebensdauer (waagrecht) und ihre eigene grösste Breite (senkrecht) umgerechnet. Linie: Median, Band: mittlere Hälfte. Wie lange und wie gross die Wolken wirklich waren, zeigen die Bilder weiter unten.',

  s2_p: 'Hier ist jede Wolke einzeln zu sehen, deren Entstehen und Auflösen beide im Bild lagen und deren Lage brauchbar war ({n} Wolken). Fotos mit Fehlmessung der Lage, mit Verbindung zu einer Nachbarwolke oder mit sprunghafter Breite sind ausgelassen. Ein Klick auf eine Linie oder einen Punkt zeigt die Wolke.',

  ch7_xx: 'Jede Linie ist eine Wolke. Die dicke Linie ist der Median aller Wolken, die zu dieser Minute noch lebten. Weil die kleinen Wolken früh verschwinden, steigt dieser Median nach hinten an; das ist eine Folge der Auswahl, nicht ein Wachsen.',

  m_t: 'Wie das entstanden ist',
  m_p1: 'Jedes Foto wurde mit der Werksvermessung der Kamera zu einem Rundumbild zusammengesetzt und mit ihrem Lagesensor lotrecht gestellt. Kleine Wackler im Wind wurden an Häusern und Horizont ausgeglichen. Norden kommt aus dem Sonnenstand, gemessen in den Fotos und gerechnet aus Uhrzeit und Ort; beides stimmte auf etwa 0.1° überein. Wolken sind dort, wo der Himmel deutlich weniger blau ist als klarer Himmel an derselben Stelle.',
  m_p2: 'Die Lage auf der Karte kommt aus der Mitte der Wolke am Himmel, gelegt auf die Höhe der Basis. Von der Seite gesehen liegt diese Mitte etwas über der Basis; ich nehme dafür 12 % der Basishöhe an. Jede Wolke zieht mit dem gemeinsamen Zug und darf eine langsame eigene Bewegung haben. Fotos, deren Lage davon weiter abweicht als 250 m beziehungsweise ein gutes Drittel der Wolkenbreite, gelten als Fehlmessung. Dort folgt die Lage dem Zug der Wolke zwischen den Fotos davor und danach. Wolken mit mehr als 30 % solcher Fotos oder mit langen Verbindungen zu Nachbarwolken gelten als «unsicher» und fehlen in der Statistik.',
  m_p3: 'Eine Wolke wird von Foto zu Foto über ihr Muster wiedergefunden. Gesucht wird dort, wo der gemeinsame Zug aller Wolken sie erwarten lässt. Laufen zwei Wolken im Bild zusammen, bleiben beide Nummern zunächst bestehen. Erst wenn sie länger als etwa 80 Sekunden verbunden bleiben, gilt die kleinere als aufgegangen. Kleine Fetzen, die sich lösen, bleiben Teil ihrer Wolke; grössere Stücke bekommen eine eigene Nummer («abgespalten»).',
  m_p4: 'In der Liste stehen nur Wolken, die mindestens 3 Minuten lang höher als 12° über dem Horizont verfolgt wurden und mindestens rund 120 m breit waren. Gebilde, die meist breiter als etwa 3 km waren, gelten als Gruppe und nicht als Einzelwolke. Insgesamt wurden {n} Spuren verfolgt, die meisten davon kurze Fetzen am Horizont.',
  m_einfach: 'Einfach gesagt: Die Kamera weiss in jedem Foto, wie sie steht und wo Norden ist. Jede Wolke wird an ihrem Aussehen von Foto zu Foto wiedererkannt.',
  e_t: 'Was man nicht überbewerten darf',
  e_basis: '<b>Die Basishöhe ist geschätzt.</b> Die Wolken zogen am Schluss rund 18 % langsamer über den Himmel als am Anfang. Bei gleichem Wind heisst das: Die Basis stieg im gleichen Verhältnis. Den Endwert habe ich aus Temperatur und Feuchte am Mittag geschätzt (36 °C, 27 %). Ob der Wind wirklich gleich blieb, lässt sich mit einer festen Kamera nicht prüfen. Alle Meterangaben, also Abstände, Breiten und Turmhöhen, hängen an dieser Zahl. Oben kann man sie ändern; alles skaliert dann mit.',
  e_horizont: '<b>Nahe am Horizont</b> werden Entfernungen sehr unsicher, und Wolken stehen dort so dicht hintereinander, dass sie im Bild zu Gruppen verschmelzen. Karte, Videos und Zahlen beruhen deshalb nur auf dem, was höher als 12° über dem Horizont stand, also bis etwa 10–12 km Abstand. Eine Wolke, die am Horizont auftaucht, beginnt ihr Leben in der Liste erst dort («über den Horizont»).',
  e_hinter: '<b>Wolken hintereinander</b> erkennt das Programm teils als eine. Im Video steht dann «verbunden mit Nachbarwolke», auf der Karte ist der Kreis gestrichelt. Wolken mit langen solchen Phasen gelten als «unsicher».',
  e_wachs: '<b>Das Wachstum</b> stammt aus der Breitenänderung über etwa zwei Minuten (Ausgleichsgerade über 9 Fotos). Für die Farbe auf der Karte zählt die Flächenänderung in Prozent je Minute, in Tabelle und Fenster die Breitenänderung in Metern je Minute. Einzelne Werte rauschen; sehr grosse Werte entstehen meist, wenn ein Stück dazukommt oder abbricht.',
  e_turm: '<b>Die Turmhöhe</b> lässt sich nur von der Seite messen, also zwischen 12° und 35° über dem Horizont, und nimmt an, dass die höchste Stelle über der Wolkenmitte liegt.',
  e_eigen: '<b>Die Eigenbewegung</b> ist die langsame Bewegung einer Wolke gegenüber dem gemeinsamen Zug, gerechnet über ihr ganzes Leben. Mit dem Wind und gegen den Wind kommen etwa gleich oft und gleich stark vor (mittlere 80 %: {a} bis +{b} m/s). Werte bis etwa 2 m/s sind deshalb vom Messfehler nicht zu unterscheiden. Eine Wolke, die über einer festen Quelle immer wieder neu wächst, würde gegen den Wind wandern; ob es solche gab, zeigen erst die Videos.',
  e_sonne: '<b>Um die Sonne</b> herum, etwa 8° weit, ist keine Aussage möglich.',
  e_leben: '<b>Der Lebenslauf</b> stützt sich nur auf Wolken, deren Entstehen und Auflösen beide im Bild lagen. Lange lebende Wolken ziehen oft vorher aus dem Bild; die Statistik zeigt deshalb eher die kurzlebigen.',
  fuss: 'Tabellen zum Weiterrechnen: <a href="tabellen/wolken.csv">wolken.csv</a> (eine Zeile je Wolke) und <a href="tabellen/verlauf.csv">verlauf.csv</a> (eine Zeile je Wolke und Foto). Die Karte braucht eine Internetverbindung. Kartendaten © OpenStreetMap-Mitwirkende, SRTM; Darstellung © OpenTopoMap (CC-BY-SA) bzw. © CARTO.',

  zusammen: 'Between {von} and {bis} the clouds drifted steadily from the east ({w0}°–{w1}°) over the camera. Of the {n} listed clouds, {g} formed within view, {a} split off a larger cloud, {h} came over the horizon and {f} were already there when recording started. {e1} dissolved before our eyes, {e2} merged into another cloud, {e3} moved below 12° above the horizon. Fully seen clouds typically lived {d} minutes and were widest at about {p} % of their lifetime.',

  m_t: 'How this was made',
  m_p1: 'Each photo was stitched into a full sphere using the camera\'s factory calibration and levelled with its built-in position sensor. Small wobbles in the wind were corrected against buildings and the horizon. North comes from the position of the sun, measured in the photos and computed from time and place; the two agreed to about 0.1°. Clouds are where the sky is clearly less blue than clear sky at the same spot.',
  m_p2: 'The position on the map comes from the centre of the cloud in the sky, placed at the height of the cloud base. Seen from the side, this centre lies somewhat above the base; I assume 12 % of the base height for that. Each cloud drifts with the common drift and may have a slow motion of its own. Photos whose position deviates from this by more than 250 m or a good third of the cloud width count as bad measurements. There the position follows the drift of the cloud between the photos before and after. Clouds with more than 30 % of such photos or with long periods joined to neighbouring clouds count as "unreliable" and are left out of the statistics.',
  m_p3: 'A cloud is found again from photo to photo by its pattern. The search looks where the common drift of all clouds would put it. When two clouds run together in the image, both numbers are kept at first. Only if they stay joined for longer than about 80 seconds is the smaller one considered merged. Small fragments that come loose remain part of their cloud; larger pieces get a number of their own ("split off").',
  m_p4: 'The list only contains clouds that were tracked for at least 3 minutes higher than 12° above the horizon and were at least about 120 m wide. Structures that were mostly wider than about 3 km count as a group, not a single cloud. In total {n} tracks were followed, most of them short fragments near the horizon.',
  m_einfach: 'In simple terms: in every photo the camera knows how it is tilted and where north is. Every cloud is recognised by its appearance from photo to photo.',
  e_t: 'What not to over-interpret',
  e_basis: '<b>The cloud base height is estimated.</b> At the end, the clouds crossed the sky about 18 % more slowly than at the start. With unchanged wind this means the base rose in the same ratio. I estimated the final value from temperature and humidity at noon (36 °C, 27 %). Whether the wind really stayed the same cannot be checked with a fixed camera. All metre values — distances, widths and tower heights — depend on this number. It can be changed at the top; everything scales with it.',
  e_horizont: '<b>Close to the horizon</b> distances become very uncertain, and clouds there stand so densely behind one another that they merge into groups in the image. Map, videos and numbers therefore only use what was higher than 12° above the horizon, i.e. up to about 10–12 km away. A cloud that appears at the horizon starts its life in the list only there ("came over the horizon").',
  e_hinter: '<b>Clouds behind one another</b> are sometimes detected as one. The video then says "joined with neighbour", and the circle on the map is dashed. Clouds with long such periods count as "unreliable".',
  e_wachs: '<b>Growth</b> comes from the change of width over about two minutes (straight-line fit over 9 photos). The colour on the map uses the change of area in percent per minute; table and cloud window use the change of width in metres per minute. Single values are noisy; very large values usually arise when a piece joins or breaks off.',
  e_turm: '<b>Tower height</b> can only be measured from the side, i.e. between 12° and 35° above the horizon, and assumes that the highest point lies above the centre of the cloud.',
  e_eigen: '<b>Own motion</b> is the slow movement of a cloud relative to the common drift, computed over its whole life. Motion with and against the wind occurs about equally often and equally strongly (middle 80 %: {a} to +{b} m/s). Values up to about 2 m/s therefore cannot be told apart from measurement error. A cloud that keeps regrowing over a fixed source would wander against the wind; whether there were such clouds only the videos can show.',

  if (!$('cfarbe').checked || g === null || g === undefined) return ['#ffffff', 0.55];
  if (g >= 15) return ['#eb6834', 0.55];
  if (g <= -15) return ['#2a78d6', 0.45];
  return ['#ffffff', 0.55];
}
function legend() { $('legende').innerHTML = $('cfarbe').checked ? t('leg_farbe') : t('leg_ohne'); }

function draw() {
  const tt = T;
  $('uhr').textContent = D.times[tt];
  $('lage').innerHTML = t('lage', {h: Math.round(H(tt)/10)*10, w: D.woher[tt], v: Math.round(D.wind[tt]*k), n: perFrame[tt].length});
  grenze.setRadius(4.705*H(tt));
  const seen = new Set();
  for (const [ci, i] of perFrame[tt]) {
    seen.add(ci);
    const [e, n, w] = pos(ci, i), c = C[ci];
    const uns = c.s.status === 'unsicher', [col, op] = fillOf(c.g[i], uns);
    let cc = circles.get(ci);
    if (!cc) {
      cc = L.circle(ll(e, n), {radius: w/2, weight: 1.2, color: '#3a3f4a', fillColor: col, fillOpacity: op});
      cc.on('click', () => select(ci, false));
      circles.set(ci, cc); lyrClouds.addLayer(cc);
      const lb = L.marker(ll(e, n), {icon: L.divIcon({className: uns ? 'lbl uns' : 'lbl', html: String(c.s.n) + (uns ? '?' : ''), iconSize: [40, 16], iconAnchor: [20, 8]}), interactive: false});
      labels.set(ci, lb); lyrLabels.addLayer(lb);
    } else {
      cc.setLatLng(ll(e, n)); cc.setRadius(w/2); cc.setStyle({fillColor: col, fillOpacity: op});
      labels.get(ci).setLatLng(ll(e, n));
    }
    const isSel = ci === sel, unsure = c.sh[i];
    cc.setStyle({weight: isSel ? 3 : (unsure ? 1 : 1.2), color: isSel ? '#000' : (uns ? '#8f8d86' : '#3a3f4a'), dashArray: unsure ? '4 4' : null});
  }
  for (const [ci, cc] of circles) if (!seen.has(ci)) { lyrClouds.removeLayer(cc); lyrLabels.removeLayer(labels.get(ci)); circles.delete(ci); labels.delete(ci); }
  lyrTrails.clearLayers();
  if ($('cspur').checked) {
    for (const [ci, i] of perFrame[tt]) {
      const pts = [];
      for (let j = Math.max(0, i - 9); j <= i; j++) { const [e, n] = pos(ci, j); pts.push(ll(e, n)); }
      if (pts.length > 1) lyrTrails.addLayer(L.polyline(pts, {color: '#52514e', weight: 1, opacity: 0.5, interactive: false}));
    }
  }
  drawSel();
  $('zeit').value = tt;
  if (selChart) selChart.update('none');
}

const vidName = n => t('vid') + 'wolke_' + String(n).padStart(4, '0') + '.mp4';

// ---------- Zeit und Abspielen
const sky = $('sky'); let skyOK = false;
sky.addEventListener('loadeddata', () => { skyOK = true; seekSky(); });
function seekSky() { if (skyOK && !playing) { try { sky.currentTime = (T + 0.5)/FPS; } catch (e) {} } }
function setT(tt) { T = Math.max(0, Math.min(nF - 1, tt)); if (playing && skyOK) sky.currentTime = (T + 0.5)/FPS; else seekSky(); draw(); }
$('zeit').max = nF - 1;
$('zeit').oninput = e => setT(+e.target.value);
$('tempo').onchange = e => { speed = +e.target.value; sky.playbackRate = speed; };
let timer = null, lastT = -1;
function loop() {
  if (!playing) return;
  if (skyOK) {
    const tt = Math.min(nF - 1, Math.floor(sky.currentTime*FPS));
    if (tt !== lastT) { T = tt; lastT = tt; draw(); }
    if (sky.ended || T >= nF - 1) { toggle(); return; }
    requestAnimationFrame(loop);
  }
}
function toggle() {
  playing = !playing;
  $('play').textContent = playing ? t('pause') : t('play');
  if (playing) {
    if (T >= nF - 1) T = 0;
    if (skyOK) { sky.currentTime = (T + 0.5)/FPS; sky.playbackRate = speed; sky.play(); lastT = -1; requestAnimationFrame(loop); }
    else timer = setInterval(() => { if (T >= nF - 1) { toggle(); return; } T++; draw(); }, 1000/(FPS*speed));
  } else { sky.pause(); clearInterval(timer); seekSky(); }
}
$('play').onclick = toggle;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  if (e.key === 'ArrowRight') setT(T + 1);
  if (e.key === 'ArrowLeft') setT(T - 1);
});

let sortCol = 0, sortDir = 1;

function filterBar(n) {

function table() {
  const th = cols.map((c, i) => `<th class="${c[2] || ''}" data-col="${i}">${t(c[0])}${i === sortCol ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
  $('tab').querySelector('thead').innerHTML = `<tr>${th}</tr>`;
  const rows = C.map((c, ci) => [ci, cols.map(col => col[1](c.s))]).filter(([ci]) => passt(C[ci].s));
  filterBar(rows.length);
  rows.sort((a, b) => { const x = a[1][sortCol], y = b[1][sortCol]; if (x === y) return 0; if (x === null) return 1; if (y === null) return -1; return (x < y ? -1 : 1)*sortDir; });
  $('tab').querySelector('tbody').innerHTML = rows.map(([ci, r]) => `<tr data-ci="${ci}">${r.map((v, i) => `<td class="${cols[i][2] || ''}">${v === null ? '–' : (cols[i][3] ? (+v).toFixed(cols[i][3]) : v)}</td>`).join('')}</tr>`).join('');
  $('tab').querySelectorAll('th').forEach(h => h.onclick = () => { const i = +h.dataset.col; sortDir = i === sortCol ? -sortDir : 1; sortCol = i; table(); });

function cycleCharts() {
  const pick = n => { const j = byN.get(n); if (j !== undefined) { select(j, true); window.scrollTo({top: 0, behavior: 'smooth'}); } };
  const grid = []; for (let m = 0; m <= 20; m += 0.5) grid.push(m);
  const med = grid.map(m => { const vals = [];
    for (const z of CY) { if (m > z.m[z.m.length - 1]) continue; let best = null, bd = 1e9;
      z.m.forEach((mm, i) => { if (z.b[i] !== null && Math.abs(mm - m) < bd) { bd = Math.abs(mm - m); best = z.b[i]; } });
      if (best !== null && bd < 0.4) vals.push(best); }
    if (vals.length < 5) return null; vals.sort((a, b) => a - b); return vals[Math.floor(vals.length/2)]*k; });
  const ds = CY.map(z => ({label: t('wolke') + ' ' + z.n, n: z.n, data: z.m.map((m, i) => ({x: m, y: z.b[i] === null ? null : z.b[i]*k})),
    borderColor: 'rgba(42,120,214,0.28)', borderWidth: 1, pointRadius: 0, pointHitRadius: 4, tension: 0.25, spanGaps: true}));
  ds.push({label: t('median'), data: grid.map((m, i) => ({x: m, y: med[i]})), borderColor: '#1d2433', borderWidth: 3, pointRadius: 0, tension: 0.3, spanGaps: true});

    options: {maintainAspectRatio: false, animation: false,
      plugins: {legend: {display: false}, tooltip: {mode: 'nearest', intersect: false, filter: it => it.dataset.n !== undefined,
        callbacks: {title: () => '', label: c => t('ch7_tip', {w: c.dataset.label, b: Math.round(c.parsed.y), m: c.parsed.x.toFixed(1)})}}},
      interaction: {mode: 'nearest', intersect: false},
      onHover: (e, els, ch) => { const di = els.length ? els[0].datasetIndex : null;
        if (di === hov) return; if (hov !== null && ch.data.datasets[hov].n !== undefined) { ch.data.datasets[hov].borderColor = 'rgba(42,120,214,0.28)'; ch.data.datasets[hov].borderWidth = 1; }
        if (di !== null && ch.data.datasets[di].n !== undefined) { ch.data.datasets[di].borderColor = '#eb6834'; ch.data.datasets[di].borderWidth = 2.5; }
        hov = di; ch.update('none'); },
      onClick: (e, els, ch) => { if (els.length) { const d = ch.data.datasets[els[0].datasetIndex]; if (d.n) pick(d.n); } },
      scales: {x: {type: 'linear', min: 0, max: 20, title: {display: true, text: t('ch7_x')}, grid: {display: false}},
               y: {beginAtZero: true, title: {display: true, text: t('ch7_y')}, grid: {color: '#ebe9e3'}}}}});
  const mx = Math.max(...CY.map(z => Math.max(z.auf, z.ab)));

  mk('ch8', {type: 'scatter', data: {datasets: [
      {label: 'a', data: CY.map(z => ({x: z.auf, y: z.ab, n: z.n})), ...pt},
      {label: 'b', type: 'line', data: [{x: 0, y: 0}, {x: mx, y: mx}], borderColor: '#7d7b75', borderDash: [5, 5], borderWidth: 1, pointRadius: 0}]},
    options: {maintainAspectRatio: false, animation: false, plugins: {legend: {display: false}, tooltip: {filter: i => i.datasetIndex === 0,
        callbacks: {label: c => t('ch8_tip', {w: t('wolke') + ' ' + c.raw.n, a: c.raw.x.toFixed(1), b: c.raw.y.toFixed(1)})}}},
      onClick: (e, els, ch) => { if (els.length && els[0].datasetIndex === 0) pick(ch.data.datasets[0].data[els[0].index].n); },
      scales: {x: {min: 0, title: {display: true, text: t('ch8_x')}, grid: {color: '#ebe9e3'}}, y: {min: 0, title: {display: true, text: t('ch8_y')}, grid: {color: '#ebe9e3'}}}}});
  mk('ch9', {type: 'scatter', data: {datasets: [{label: 'a', data: CY.map(z => ({x: z.dauer, y: z.maxb*k, n: z.n})), ...pt}]},
    options: {maintainAspectRatio: false, animation: false, plugins: {legend: {display: false},
        tooltip: {callbacks: {label: c => t('ch9_tip', {w: t('wolke') + ' ' + c.raw.n, a: c.raw.x.toFixed(1), b: Math.round(c.raw.y)})}}},
      onClick: (e, els, ch) => { if (els.length) pick(ch.data.datasets[0].data[els[0].index].n); },
      scales: {x: {min: 0, title: {display: true, text: t('ch9_x')}, grid: {color: '#ebe9e3'}}, y: {beginAtZero: true, title: {display: true, text: t('ch9_y')}, grid: {color: '#ebe9e3'}}}}});
  const auf = median(CY.map(z => z.auf)), ab = median(CY.map(z => z.ab));
  $('einfach2').textContent = t('einfach2', {a: auf.toFixed(1), b: ab.toFixed(1), l: CY.filter(z => z.ab > z.auf).length, n: CY.length});
}
$('mehr').addEventListener('toggle', () => { if ($('mehr').open) Object.values(charts).forEach(c => c.resize()); });
function texts() {
  document.documentElement.lang = LANG;
  document.title = t('titel');
  const von = hm(D.times[0]), bis = hm(D.times[nF - 1]);
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = t(el.dataset.i, {von, bis, t: bis}); });
  $('lde').classList.toggle('on', LANG === 'de'); $('len').classList.toggle('on', LANG === 'en');
  $('play').textContent = playing ? t('pause') : t('play');
  $('zeit').setAttribute('aria-label', t('d_zeit'));
  document.querySelector('[data-i="s2_p"]').innerHTML = t('s2_p', {n: CY.length});
  document.querySelector('[data-i="m_p4"]').innerHTML = t('m_p4', {n: S.n_spuren.toLocaleString(t('zahl'))});
  document.querySelector('[data-i="e_eigen"]').innerHTML = t('e_eigen', {a: S.mit.p10, b: S.mit.p90});
  const lf = S.life, g = S.geburt, e = S.ende;
  const medFull = median(CY.map(z => z.dauer)) ?? 0;
  const peak = lf.x[lf.med.indexOf(Math.max(...lf.med))];
  $('kpis').innerHTML = [[S.n_all, t('k_liste')], [S.status.sicher, t('st_sicher')], [S.status.unsicher, t('k_unsicher')],
    [medFull.toFixed(1) + ' min', t('k_leben')]].map(([v, x]) => `<div class="kpi"><b>${v}</b><span>${x}</span></div>`).join('');
  $('zusammen').textContent = t('zusammen', {von, bis, w0: D.woher[0], w1: D.woher[nF - 1], n: S.n_all, g: g.gesehen, a: g.abgespalten, h: g.horizont, f: g.fertig,
    e1: e.aufgeloest || 0, e2: e.verschmolzen || 0, e3: e['unter 12 Grad gezogen'] || 0, d: medFull.toFixed(0), p: peak});
  $('einfach1').textContent = t('einfach1');
  cam.unbindTooltip(); cam.bindTooltip(t('kamera'), {direction: 'right'});
  legend();
}
function setLang(l) {
  LANG = l; try { localStorage.setItem('wolken_lang', l); } catch (e) {}
  const wasPlaying = playing; if (playing) toggle();
  skyOK = false; sky.src = t('vid') + 'himmel.mp4'; sky.load();
  texts(); allCharts();
  if (sel !== null) select(sel, false); else panelEmpty();
  if ($('dtab').open) table();
  draw();
}
$('lde').onclick = () => setLang('de');
$('len').onclick = () => setLang('en');

// ---------- Start
map.fitBounds(L.latLng(lat0, lon0).toBounds(2*3.2*D.H[0]));
setLang(LANG);
</script>
</body>
